<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Lessons</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>


</head>

 
<body>
 
    <!-- The Vue app mounts on this element -->
    <div id="app">
 
        <header>
            <h1><i class="fa fa-graduation-cap"></i> Our Lessons</h1>
            <button @click="displayCart = !displayCart" :disabled="!displayCart && cart.length === 0">
                <i class="fa fa-shopping-cart"></i>
                {{ displayCart ? 'Back to Lessons' : 'Cart (' + cartCount + ')' }}
            </button>
        </header>
 
        <main>
 
            <!-- LESSONS PAGE -->
            <section v-if="!displayCart">
                <h2>Available Lessons</h2>

                <p v-if="orderMessage" class="order-message">{{ orderMessage }}</p>

                <label> Sort by: 
                    <select v-model="sortBy">
                        <option value="subject">Subject</option>
                        <option value="location">Location</option>
                        <option value="price">Price</option>
                        <option value="availability">Spaces</option>
                    </select>
                </label>

                <label> Order: 
                    <select v-model="isAscending">
                        <option :value="true">Ascending</option>
                        <option :value="false">Descending</option>
                    </select>
                </label>

                <ul class="lessons">
                    <li class="lesson" v-for="lesson in sortedLessons" :key="lesson.Id">
                        <img :src="apiUrl + '/images/' + lesson.image" width="200" height="150" :alt="lesson.subject">
 
                        <ul class="details">
                            <li class="title" v-text="lesson.subject"></li>
                            <li v-text="'ID: ' + lesson.Id"></li>
                            <li v-text="'Location: ' + lesson.location"></li>
                            <li v-text="'Price: £' + lesson.price"></li>
                            <li v-text="lesson.availability > 0 ? 'Availability: ' + lesson.availability + ' spaces left' : 'Fully booked'"
                                :class="{ soldout: lesson.availability === 0 }"></li>
                            <li>
                                <button @click="addToCart(lesson)" :disabled="lesson.availability === 0">
                                    <i class="fa fa-cart-plus"></i> Add to Cart
                                </button>
                            </li>
                        </ul>
                    </li>
                </ul>
            </section>
 
            <!-- CART PAGE -->
            <section v-else class="cart">
                <h2>Your Cart</h2>
 
                <p v-if="cart.length === 0" class="empty">Your cart is empty.</p>
 
                <ul class="cart-list">
                    <li class="cart-item" v-for="item in cart" :key="item.Id">
                        <span class="info" v-text="item.subject + ' (' + item.Id + ') - ' + item.location"></span>
                        <span v-text="'£' + item.price + ' x ' + item.quantity"></span>
                        <span class="line-total" v-text="'= £' + (item.price * item.quantity)"></span>
 
                        <span class="qty">
                            <button @click="removeOne(item)" aria-label="Remove one"><i class="fa fa-minus"></i></button>
                            <button @click="addToCart(findLesson(item.Id))"
                                :disabled="findLesson(item.Id).availability === 0" aria-label="Add one">
                                <i class="fa fa-plus"></i>
                            </button>
                        </span>
 
                        <button class="remove" @click="removeFromCart(item)">
                            <i class="fa fa-trash"></i> Remove
                        </button>
                    </li>
                </ul>
 
                <div class="cart-footer">
                     <span v-text="'Total: £' + cartTotal"></span>

                    <input v-model="name" placeholder="Name (letters only)">
                    <input v-model="phone" placeholder="Phone (numbers only)">

                    <button @click="checkout" :disabled="!canCheckout">
                        <i class="fa fa-credit-card"></i> Checkout
                    </button>
                </div>
            </section>
 
        </main>
    </div>
 
 
    <script>
        const { createApp } = Vue
 
        createApp({
            data() {
                return {
                    apiUrl: 'https://backend-m01010322.onrender.com',
                    lessons: [],
                    isAscending: true,
                    displayCart: false,
                    cart: [],
                    name: '',
                    phone: '',
                    orderMessage: '',
                }
            },
 
            computed: {
                cartCount() {
                    return this.cart.reduce((sum, item) => sum + item.quantity, 0)
                },
                cartTotal() {
                    return this.cart.reduce((sum, item) => sum + item.price * item.quantity, 0)
                },
                sortedLessons() {
                    const key = this.sortBy
                    const dir = this.isAscending ? 1 : -1
                    return this.lessons.slice().sort((a, b) => {
                        if (typeof a[key] === 'string') {
                            return a[key].localeCompare(b[key]) * dir
                        }
                            return (a[key] - b[key]) * dir
                    })
                },
                validName() {
                    return /^[a-zA-Z\s]+$/.test(this.name.trim())
                },
                validPhone() {
                    return /^[0-9]+$/.test(this.phone)
                },
                canCheckout() {
                    return this.validName && this.validPhone
                }
            },

            created() {
                this.fetchData();
            },
            


 
            methods: {
                async fetchData() {
                    try {
                        const response = await fetch(this.apiUrl + '/lessons');
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        
                        const data = await response.json();
                        console.log("Lessons received:", data);
                        
                        if (!Array.isArray(data)) {
                            throw new Error("The backend response is not an array.");
                        }
                        
                        this.lessons = data;
                    
                    } catch (error) {
                        console.error("Failed to fetch lessons:", error);
                    }
                },
                findLesson(id) {
                    return this.lessons.find(l => l.Id === id)
                },
                async updateLesson(lesson) {
                    const updateBody = { availability: lesson.availability };
                    const url = this.apiUrl + '/lessons/' + lesson.Id;
                    const options = {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updateBody)
                    };
                    await fetch(url, options);
                },
 
                addToCart(lesson) {
                    if (lesson.availability <= 0) return
 
                    const existing = this.cart.find(item => item.Id === lesson.Id)
 
                    if (existing) {
                        existing.quantity++
                    } else {
                        this.cart.push({
                            Id: lesson.Id,
                            subject: lesson.subject,
                            location: lesson.location,
                            price: lesson.price,
                            quantity: 1
                        })
                    }
 
                    lesson.availability--
                },
 
                // remove a single space from the cart and give it back to the lesson
                removeOne(item) {
                    this.findLesson(item.Id).availability++
                    item.quantity--
 
                    if (item.quantity === 0) {
                        this.cart = this.cart.filter(c => c.Id !== item.Id)
                    }
                    this.closeCartIfEmpty()
                },
 
                // remove the whole lesson from the cart
                removeFromCart(item) {
                    this.findLesson(item.Id).availability += item.quantity
                    this.cart = this.cart.filter(c => c.Id !== item.Id)
                    this.closeCartIfEmpty()
                },
 
                closeCartIfEmpty() {
                    if (this.cart.length === 0) this.displayCart = false
                },
 
                checkout() {
                    if (!this.canCheckout || this.cart.length === 0) return

                    this.orderMessage = 'Thank yiy ' + this.name.trim() + '! Your order has been submitted!'
                    this.cart = []
                    this.name = ''
                    this.phone = ''
                    this.displayCart = false
                }
            }
 
        }).mount("#app")   // must match the id of the element above
    </script>
 
</body>
 
</html>
